<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none">
  <defs>
    <linearGradient id="signGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>
  <!-- leo handwritten signature -->
  <path d="M15,70 
           Q20,55 28,52 
           Q38,48 45,55 
           Q50,60 48,70 
           Q46,82 52,88 
           Q60,92 70,85 
           Q80,78 82,68 
           Q84,55 78,48" 
        stroke="url(#signGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
  <!-- e flourish -->
  <path d="M62,58 
           Q68,52 78,55 
           Q88,58 88,70 
           Q88,80 78,82 
           Q70,83 65,78" 
        stroke="url(#signGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
  <!-- o -->
  <ellipse cx="100" cy="68" rx="18" ry="20" stroke="url(#signGrad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95" transform="rotate(-8 100 68)"/>
  <!-- connecting stroke from e to o -->
  <path d="M80,65 Q88,60 95,62" stroke="url(#signGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95"/>
  <!-- long tail flourish -->
  <path d="M115,55 
           Q140,40 175,48 
           Q210,56 240,45 
           Q260,38 268,30" 
        stroke="url(#signGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- underline accent -->
  <path d="M20,98 Q60,92 100,95 Q150,98 200,90 Q240,82 265,75" 
        stroke="url(#signGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>